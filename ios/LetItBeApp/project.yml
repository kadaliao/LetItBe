name: LetItBeApp
options:
  bundleIdPrefix: com.letitbe
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: HMDAVG9B8J
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
    SDKROOT: iphoneos
targets:
  LetItBeApp:
    type: application
    platform: iOS
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.letitbe.app
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - App
      - Views
      - ViewModels
      - Models
      - Services
      - Persistence
      - Shared
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: LetItBeWidget
        embed: true
  LetItBeWidget:
    type: app-extension
    platform: iOS
    settings:
      base:
        INFOPLIST_FILE: ../LetItBeWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.letitbe.app.widget
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - path: ../LetItBeWidget
        excludes:
          - "Info.plist"
      - path: Models/Card.swift
      - path: Models/State.swift
      - path: Models/ContentPayload.swift
      - path: Services/ContentRepository.swift
      - path: Shared
      - path: Resources
        buildPhase: resources
  LetItBeTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: LetItBeApp
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.letitbe.app.tests
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - path: ../LetItBeTests
      - path: Resources/content.json
        buildPhase: resources
  LetItBeUITests:
    type: bundle.ui-testing
    platform: iOS
    dependencies:
      - target: LetItBeApp
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.letitbe.app.uitests
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - path: ../LetItBeUITests
schemes:
  LetItBeApp:
    shared: true
    build:
      targets:
        LetItBeApp: all
    test:
      targets:
        - LetItBeTests
        - LetItBeUITests
    run:
      config: Debug
    archive:
      config: Release
